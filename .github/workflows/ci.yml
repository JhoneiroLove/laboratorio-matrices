name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Lint OpenAPI contracts
        run: npx --yes @redocly/cli@2.5.0 lint contracts/openapi/*.yaml

  matrix-api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/matrix-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: services/matrix-api/go.sum
      - run: go test -race -cover ./...
      - run: go vet ./...

  statistics-api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/statistics-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: services/statistics-api/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npx tsc --noEmit

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/vue-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/vue-app/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npx vue-tsc --noEmit

  e2e:
    runs-on: ubuntu-latest
    needs: [contracts, matrix-api, statistics-api, web]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Start complete stack
        run: docker compose up --build --detach --wait --wait-timeout 180
      - name: Run acceptance flow
        run: node --test tests/e2e/process-flow.test.mjs
      - name: Capture service logs
        if: failure()
        run: docker compose logs --no-color
      - name: Stop complete stack
        if: always()
        run: docker compose down --volumes
