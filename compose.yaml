name: matrix-platform

services:
  jwt-keygen:
    build:
      context: deploy/keygen
    volumes:
      - jwt-keys:/keys
    restart: "no"

  statistics-api:
    build:
      context: services/statistics-api
    environment:
      PORT: "3000"
      CORS_ORIGINS: http://localhost:8080
      JWT_PUBLIC_KEY_PATH: /keys/jwt-public.pem
      JWT_ISSUER: ${JWT_ISSUER:-matrix-platform}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-matrix-platform}
      MATRIX_EPSILON: "1e-10"
      LOG_LEVEL: info
    volumes:
      - jwt-keys:/keys:ro
    depends_on:
      jwt-keygen:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/health/ready || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 5
      start_period: 5s
    ports:
      - "127.0.0.1:3000:3000"
    restart: unless-stopped

  backend:
    build:
      context: services/matrix-api
    environment:
      MATRIX_API_ADDR: :8080
      ANALYTICS_BASE_URL: http://statistics-api:3000
      JWT_PRIVATE_KEY_PATH: /keys/jwt-private.pem
      JWT_PUBLIC_KEY_PATH: /keys/jwt-public.pem
      JWT_ISSUER: ${JWT_ISSUER:-matrix-platform}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-matrix-platform}
      DEMO_USERNAME: ${DEMO_USERNAME:-demo}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-matrix-demo-change-me}
    volumes:
      - jwt-keys:/keys:ro
    depends_on:
      jwt-keygen:
        condition: service_completed_successfully
      statistics-api:
        condition: service_healthy
    ports:
      - "127.0.0.1:8081:8080"
    restart: unless-stopped

  web:
    build:
      context: web/vue-app
    depends_on:
      - backend
    environment:
      MATRIX_API_URL: http://backend:8080
    ports:
      - "127.0.0.1:8080:8080"
    restart: unless-stopped

volumes:
  jwt-keys:
